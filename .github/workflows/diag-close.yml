name: diag-close
on:
  push:
    branches: ['INN-726/**']
  workflow_dispatch:
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: loop the full suite x12 with lookup diagnostics
        shell: bash
        env: { DIAG_CLOSE: '1' }
        run: |
          fails=0
          for i in $(seq 1 12); do
            s=$(date +%s%N)
            if node --test > out.txt 2>&1; then r=pass; else r=FAIL; fails=$((fails+1)); fi
            echo "LOOP $i $r $(( ($(date +%s%N)-s)/1000000 ))ms"
            grep -E "DIAG procInfo" out.txt | head -8
            if [ $r = FAIL ]; then grep -nE "^not ok|# Subtest: a body naming|its process was not|another process|duration_ms" out.txt | head -15; fi
          done
          echo "LOOP failures=$fails"
