name: diag-close
on:
  push:
    branches: ['INN-726/**']
  workflow_dispatch:
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: lookup timings
        run: node .diag/procinfo-timing.mjs
      - name: loop the test x30
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 30); do
            s=$(date +%s%N)
            if node --test test/close-server.test.mjs > out.txt 2>&1; then r=pass; else r=FAIL; fails=$((fails+1)); cat out.txt | head -40; fi
            echo "LOOP $i $r $(( ($(date +%s%N)-s)/1000000 ))ms"
          done
          echo "LOOP failures=$fails"
          [ $fails -eq 0 ]
