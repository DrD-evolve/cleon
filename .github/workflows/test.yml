name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Windows: parts of the server (resources, window raising) are Windows-only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
