<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/gridstack.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="grid-bg"></div>
  <header>
    <div class="brand"><span class="pulse"></span>MISSION&nbsp;CONTROL</div>
    <div class="stats" id="stats"></div>
    <div class="panel-menu"><button id="panels-btn" title="Add, remove or reset panels">＋ Panels</button><div id="panels-list" hidden></div></div>
    <div class="clock" id="clock"></div>
  </header>

  <main>
    <!-- Panels live on the grid; removed ones wait in #dock so their render targets still exist. -->
    <div class="grid-stack" id="board"></div>
    <div id="dock" hidden>
    <section class="panel" data-panel="sessions">
      <h2 class="panel-handle">Sessions <span class="count" id="sessions-count"></span></h2>
      <div class="list" id="sessions"></div>
    </section>

    <section class="panel" data-panel="herdr">
      <h2 class="panel-handle">Herdr <span class="count" id="herdr-count"></span></h2>
      <div class="list" id="herdr"></div>
    </section>

    <section class="panel" data-panel="knowledge">
      <h2 class="panel-handle">Knowledge
        <span class="views" id="kviews"><button data-v="map">Map</button><button data-v="outline">Outline</button><button data-v="links">Links</button></span>
        <span class="legend" id="legend"></span>
        <input id="search" placeholder="search nodes…" autocomplete="off">
        <button id="orbit" title="Idle orbit of the 3D map (off = still screen, lighter over RDP)">orbit</button>
        <button id="refresh-graph" title="Rescan files">⟳</button>
      </h2>
      <div id="graph" class="kview"></div>
      <div id="outline" class="kview" hidden></div>
      <div id="links" class="kview" hidden></div>
    </section>

    <section class="panel" data-panel="side">
      <nav class="tabs panel-handle">
        <button data-tab="linear" class="on">Linear <span class="count" id="linear-count"></span></button>
        <button data-tab="github">GitHub <span class="count" id="github-count"></span></button>
        <button data-tab="projects">Repos <span class="count" id="projects-count"></span></button>
        <button data-tab="inbox">Inbox</button>
      </nav>
      <div class="list tab-body" id="linear"></div>
      <div class="list tab-body" id="github" hidden></div>
      <div class="list tab-body" id="projects" hidden></div>
      <div class="list tab-body" id="inbox" hidden><div class="placeholder">Waiting on the Google Cloud OAuth setup (see the Gmail MCP Server README). Read-only Gmail access lands here.</div></div>
    </section>

    <section class="panel" data-panel="flows">
      <h2 class="panel-handle">Orchestration flows <label class="toggle"><input type="checkbox" id="show-stale"> show inactive</label></h2>
      <div id="flows"></div>
    </section>
    </div>
  </main>

  <div id="tiles"></div>
  <script src="/vendor/3d-force-graph.min.js"></script>
  <script src="/vendor/force-graph.min.js"></script>
  <script src="/vendor/gridstack-all.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
