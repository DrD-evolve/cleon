<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cleon</title>
  <link rel="icon" href="/icon-192.png">
  <script>
    // The saved theme and motion, applied before the first paint so the page never shows the other look first.
    // The ＋ Panels menu writes mc.theme and mc.motion (app.js). Horizon unless the saved theme is neon; motion follows the system unless full or calm.
    try {
      var root = document.documentElement, theme = localStorage.getItem('mc.theme'), motion = localStorage.getItem('mc.motion');
      root.dataset.theme = theme === 'neon' ? 'neon' : 'horizon';
      if (motion === 'full' || motion === 'calm') root.dataset.motion = motion;
    } catch (e) { document.documentElement.dataset.theme = 'horizon'; }
  </script>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="view-page">
  <div class="tile view-tile"><div class="tile-bar"><span class="title"></span><span class="sub"></span></div><div class="tile-body"><p class="placeholder">loading…</p></div></div>
  <script type="module">
    // One knowledge file in its own window (⧉ in a file tile): /view?id=<file id>. The tie to the page that opened it is
    // cut first: a link in the file (a PDF's, say) can take this window to another site, and that site must not be able
    // to reach Cleon's window through window.opener.
    import { showFile } from '/viewer.mjs';
    window.opener = null;
    showFile(document.querySelector('.view-tile'), new URLSearchParams(location.search).get('id') ?? '', { standalone: true });
  </script>
</body>
</html>
